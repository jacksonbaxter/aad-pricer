name: Set up the job
description: >
  Installs Ninja, the pinned LLVM and the pinned data captures, each only if the job needs it.
  LLVM comes from scripts/fetch_tools.sh, which checks its sha256, and from no other place.

inputs:
  ninja:
    description: Install Ninja
    default: "true"
  llvm:
    description: Install LLVM 23.1.4 and select clang
    default: "true"
  data:
    description: Fetch the pinned TAIFEX captures into data/
    default: "true"
  libcxx:
    description: >
      On Linux, have clang++ use the pinned LLVM's own libc++, as on the Linux measurement host.
      "false" leaves it on the image's libstdc++.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Ninja on Linux
      if: inputs.ninja == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Install Ninja on macOS
      if: inputs.ninja == 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install ninja

    - name: Restore LLVM
      if: inputs.llvm == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/tools/llvm
        key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch_tools.sh') }}

    - name: Install LLVM
      if: inputs.llvm == 'true'
      shell: bash
      run: |
        scripts/fetch_tools.sh --llvm
        echo "$PWD/build/tools/llvm/bin" >> "$GITHUB_PATH"
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "CXX=clang++" >> "$GITHUB_ENV"

    # The Linux measurement host's clang++ defaults to libc++ through a clang++.cfg beside the
    # binary: -stdlib=libc++, and an rpath to LLVM's lib/x86_64-unknown-linux-gnu applied at link
    # time only (the $ prefix). This writes the same file. Without it the LLVM release's clang++
    # uses the image's libstdc++, which the GCC jobs cover. The LLVM cache may hold a cfg from
    # another job, so the libstdc++ case deletes it. A probe then shows which library a program
    # gets and that it runs.
    - name: Choose the C++ library for clang++ on Linux
      if: inputs.llvm == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        LIBCXX: ${{ inputs.libcxx }}
      run: |
        llvm=$PWD/build/tools/llvm
        cfg=$llvm/bin/clang++.cfg
        triple=x86_64-unknown-linux-gnu
        if [[ $LIBCXX == true ]]; then
          for file in "lib/$triple/libc++.so.1" "lib/$triple/libc++abi.so.1" \
            include/c++/v1/vector "include/$triple/c++/v1/__config_site"; do
            if [[ ! -e $llvm/$file ]]; then
              echo "::error::the LLVM release has no $file"
              exit 1
            fi
          done
          printf '%s\n' '-stdlib=libc++' "\$-Wl,-rpath,<CFGDIR>/../lib/$triple" >"$cfg"
          want=libc++
        else
          rm -f -- "$cfg"
          want=libstdc++
        fi
        if [[ -f $cfg ]]; then cat -- "$cfg"; else echo "no clang++.cfg"; fi
        probe=$RUNNER_TEMP/stdlib-probe
        printf '%s\n' '#include <cstdio>' '#include <version>' 'int main() {' \
          '#ifdef _LIBCPP_VERSION' '  std::puts("libc++");' '#else' '  std::puts("libstdc++");' \
          '#endif' '}' >"$probe.cpp"
        "$llvm/bin/clang++" -o "$probe" "$probe.cpp"
        got=$("$probe")
        ldd "$probe" | grep -E 'libc\+\+|libstdc\+\+'
        echo "clang++ uses $got"
        if [[ $got != "$want" ]]; then
          echo "::error::clang++ uses $got, not $want"
          exit 1
        fi

    # The measurement Mac builds against the macOS 27.2 SDK. On the xcode-27 image that SDK comes
    # with Xcode 27.2; the default Xcode there, 27.1, has 27.0. The macOS jobs in ci.yml say why.
    - name: Select the macOS 27.2 SDK
      if: inputs.llvm == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        developer=/Applications/Xcode_27.2.app/Contents/Developer
        echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
        echo "SDKROOT=$(DEVELOPER_DIR=$developer xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
        sw_vers
        printf 'macOS SDK %s\n' "$(DEVELOPER_DIR=$developer xcrun --sdk macosx --show-sdk-version)"

    - name: Restore the data captures
      if: inputs.data == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: data
        key: taifex-${{ hashFiles('scripts/data_manifest.txt') }}
        enableCrossOsArchive: true

    - name: Fetch and verify the data captures
      if: inputs.data == 'true'
      shell: bash
      run: |
        scripts/fetch_data.sh
        scripts/fetch_data.sh --verify

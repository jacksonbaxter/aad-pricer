# Mirrors scripts/check.sh job by job. The two share run_tests.py, so a skipped test fails here
# as it does there. QuantLib stays off: AAD_PRICER_BUILD_QUANTLIB_COMPARE is set in configure.
# Actions are pinned to the commit of the tag in the comment, resolved with git ls-remote.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AADP_JOBS: "4"
  AADP_FUZZ_SECONDS: "30"
  # Counters depend on the runner's kernel settings. The test skips itself without them.
  ALLOWED_SKIPS: '^PerfCounters\.EachRegionReportsItsOwnTimes$'

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Linux clang uses the pinned LLVM's libc++, as the Linux measurement host's clang++ does
        # (the setup action writes the same clang++.cfg). The GCC jobs use libstdc++, which keeps
        # that library built and tested.
        include:
          - { name: linux-clang-debug, os: ubuntu-24.04, compiler: clang, preset: debug, test: true }
          - { name: linux-clang-release, os: ubuntu-24.04, compiler: clang, preset: release, test: true }
          - { name: linux-gcc-debug, os: ubuntu-24.04, compiler: gcc, preset: debug, test: true }
          - { name: linux-gcc-release, os: ubuntu-24.04, compiler: gcc, preset: release-gcc, test: true }
          - { name: linux-asan-ubsan, os: ubuntu-24.04, compiler: clang, preset: asan-ubsan, test: true }
          - { name: linux-tsan, os: ubuntu-24.04, compiler: clang, preset: tsan, test: true }
          - { name: linux-avx2, os: ubuntu-24.04, compiler: clang, preset: release-avx2, test: true }
          # AVX-512 is built, and tested where the runner can run it, by simd-lanes below.
          # The measurement Mac compiles against LLVM 23.1.4's own libc++ headers and links the
          # system /usr/lib/libc++.1.dylib, on macOS 27.2 with the 27.2 SDK. The xcode-27 image
          # (a preview) runs macOS 27, and the setup action selects Xcode 27.2 for its 27.2 SDK.
          # Still different: the runner's OS is 27.0.1, so the libc++ the tests run on is that
          # build, not 27.2's; the SDK is Xcode's, not the Command Line Tools'; and a preview has
          # no SLA and may be relabelled at GA. macos-15 linked a 15.5 SDK whose libc++ lacks
          # symbols those headers call (std::__1::__hash_memory). Details in NOTES.md.
          - { name: macos-clang-debug, os: xcode-27, compiler: clang, preset: debug, test: true }
          - { name: macos-clang-release, os: xcode-27, compiler: clang, preset: release, test: true }
          - { name: macos-asan-ubsan, os: xcode-27, compiler: clang, preset: asan-ubsan, test: true }
          - { name: macos-tsan, os: xcode-27, compiler: clang, preset: tsan, test: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          llvm: ${{ matrix.compiler == 'clang' }}
          data: ${{ matrix.test }}

      # The release-gcc preset names plain gcc. 14 is newer than the image's default of 13, and
      # this override reaches the debug preset too, which names no compiler.
      - name: Install g++ 14
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get install -y g++-14
          echo "GCC_CC=gcc-14" >> "$GITHUB_ENV"
          echo "GCC_CXX=g++-14" >> "$GITHUB_ENV"

      - name: Configure
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          args=(-DAAD_PRICER_BUILD_QUANTLIB_COMPARE=OFF)
          if [[ -n ${GCC_CXX:-} ]]; then
            args+=("-DCMAKE_C_COMPILER=$GCC_CC" "-DCMAKE_CXX_COMPILER=$GCC_CXX")
          fi
          cmake --preset "$PRESET" "${args[@]}"

      - name: Build
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$PRESET" --parallel "$AADP_JOBS"

      # Which libc++ the binaries link, and the version of it in the SDK, for the run's record.
      - name: Show the C++ runtime linked
        if: runner.os == 'macOS'
        env:
          PRESET: ${{ matrix.preset }}
        run: otool -L "build/$PRESET/bin/aadp_smoke"

      # 1 means a virtual machine. GitHub's macOS runners are, and their kernel leaves the
      # proc_pid_rusage counters ri_cycles and ri_instructions still, so the harness writes them as
      # unavailable and PerfCounters.MacOsCountersAreProcessWideAndLabelled checks that it does.
      - name: Show whether the runner is a virtual machine
        if: runner.os == 'macOS'
        run: sysctl kern.hv_vmm_present hw.model

      # The macOS runners start a job at nice -10, and the stamp tool refuses any level but 0, as
      # its tests check. Raising niceness needs no privilege, so the tests go up by the measured
      # offset; a job above 0 could only come down with privilege, so it fails instead.
      - name: Test
        if: matrix.test
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          level=$(ps -o ni= -p $$)
          level=${level//[[:space:]]/}
          if ((level > 0)); then
            echo "::error::the job runs at nice $level, which only privilege could lower to 0"
            exit 1
          fi
          offset=$((-level))
          now=$(nice -n "$offset" python3 -I -c 'import os; print(os.nice(0))')
          printf 'the job runs at nice %s; the tests run under nice -n %s, at nice %s\n' \
            "$level" "$offset" "$now"
          [[ $now == 0 ]] || exit 1
          nice -n "$offset" python3 -I scripts/run_tests.py ctest "$PRESET" --jobs "$AADP_JOBS" \
            --allow-skipped "$ALLOWED_SKIPS"

  # The lane matrix: one job per SIMD lane width, each running the simd-labelled tests (the lane
  # kernels, Philox lanes, paths and prices against the scalar ones, bit for bit, the vector tape's
  # gradients against the scalar tape's, bit for bit, and the SIMD bench's smoke run with its
  # in-run checks). Widths 2 and 4 also run the full suite in
  # build-test (macos-*, linux-clang-*, linux-avx2). A job whose CPU lacks its target's features
  # fails, except AVX-512: a GitHub runner may or may not have it, so that job builds the whole
  # tree and runs the tests only if /proc/cpuinfo lists every x86-64-v4 feature. Otherwise it says
  # it was build-only, in a warning and in the job summary; it never passes silently.
  simd-lanes:
    name: simd-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lanes-1-scalar
            os: ubuntu-24.04
            arch: x86_64
            preset: release
            target: scalar
            cpu: ""
            optional: false
            all: false
          - name: lanes-2-sse2
            os: ubuntu-24.04
            arch: x86_64
            preset: release
            target: baseline
            cpu: sse2
            optional: false
            all: false
          - name: lanes-2-neon
            os: xcode-27
            arch: arm64
            preset: release
            target: baseline
            cpu: ""
            optional: false
            all: false
          - name: lanes-4-avx2
            os: ubuntu-24.04
            arch: x86_64
            preset: release-avx2
            target: avx2
            cpu: avx avx2 bmi1 bmi2 f16c fma abm movbe aes pclmulqdq
            optional: false
            all: false
          - name: lanes-8-avx512
            os: ubuntu-24.04
            arch: x86_64
            preset: release-avx512
            target: avx512
            cpu: >-
              avx avx2 bmi1 bmi2 f16c fma abm movbe aes pclmulqdq
              avx512f avx512bw avx512cd avx512dq avx512vl
            optional: true
            all: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          data: "false"

      - name: Check the CPU
        id: cpu
        env:
          LANE_JOB: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          NEEDS: ${{ matrix.cpu }}
          OPTIONAL: ${{ matrix.optional }}
        run: |
          missing=()
          machine=$(uname -m)
          [[ $machine == "$ARCH" ]] || missing+=("$ARCH (the runner is $machine)")
          if [[ -n $NEEDS ]]; then
            flags=" $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2) "
            for flag in $NEEDS; do
              [[ $flags == *" $flag "* ]] || missing+=("$flag")
            done
          fi
          if ((${#missing[@]} == 0)); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf '%s: the runner has %s\n' "$LANE_JOB" "${NEEDS:-$ARCH}"
          elif [[ $OPTIONAL == true ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            message="BUILD ONLY: the runner's CPU lacks ${missing[*]}, so the agreement tests did not run"
            echo "::warning title=$LANE_JOB was build-only::$message"
            printf '### %s\n\n%s\n' "$LANE_JOB" "$message" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=$LANE_JOB cannot run::the runner's CPU lacks ${missing[*]}"
            exit 1
          fi

      - name: Configure
        env:
          PRESET: ${{ matrix.preset }}
          TARGET: ${{ matrix.target }}
        run: cmake --preset "$PRESET" -DAAD_PRICER_BUILD_QUANTLIB_COMPARE=OFF "-DAADP_SIMD_TARGET=$TARGET"

      - name: Build
        env:
          PRESET: ${{ matrix.preset }}
          ALL: ${{ matrix.all }}
        run: |
          targets=()
          if [[ $ALL != true ]]; then
            for target in aadp_simd_math_agreement_test aadp_simd_philox_lanes_test \
              aadp_simd_path_agreement_test aadp_simd_price_agreement_test aadp_bench_simd \
              aadp_simd_lane_tape_test aadp_simd_lane_gradient_test \
              aadp_simd_lane_tape_memory_test aadp_simd_fallback_cost; do
              targets+=(--target "$target")
            done
          fi
          cmake --build --preset "$PRESET" --parallel "$AADP_JOBS" "${targets[@]}"

      - name: Test the simd label
        if: steps.cpu.outputs.run == 'true'
        env:
          PRESET: ${{ matrix.preset }}
        # At nice 0, as in build-test: the macOS runners start a job at nice -10.
        run: |
          level=$(ps -o ni= -p $$)
          level=${level//[[:space:]]/}
          if ((level > 0)); then
            echo "::error::the job runs at nice $level, which only privilege could lower to 0"
            exit 1
          fi
          offset=$((-level))
          now=$(nice -n "$offset" python3 -I -c 'import os; print(os.nice(0))')
          printf 'the job runs at nice %s; the tests run under nice -n %s, at nice %s\n' \
            "$level" "$offset" "$now"
          [[ $now == 0 ]] || exit 1
          junit="$PWD/build/logs/simd-lanes-junit.xml"
          mkdir -p build/logs
          status=0
          nice -n "$offset" ctest --test-dir "build/$PRESET" -L simd --no-tests=error \
            --output-on-failure --parallel "$AADP_JOBS" --output-junit "$junit" || status=$?
          python3 -I scripts/run_tests.py verdict "$junit" || status=1
          exit "$status"

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ninja: "false"
          data: "false"
      - run: scripts/check_format.sh

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On libc++, as the Linux measurement host builds.
      - uses: ./.github/actions/setup
        with:
          data: "false"
      # Prints each finding; the full logs, with notes and source lines, go up as an artifact.
      - run: scripts/run_clang_tidy.sh --jobs "$AADP_JOBS" release fuzz
      - name: Keep the tidy logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-tidy-logs
          path: build/logs/tidy/
          if-no-files-found: warn
          retention-days: 14

  # The same on libstdc++, which the GCC jobs build: include-cleaner's findings differ by library
  # (on the Linux host, 10 findings in 8 files with libstdc++ and 2 with libc++, before bb7b26f).
  clang-tidy-libstdcxx:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          data: "false"
          libcxx: "false"
      - run: scripts/run_clang_tidy.sh --jobs "$AADP_JOBS" release fuzz
      - name: Keep the tidy logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-tidy-libstdcxx-logs
          path: build/logs/tidy/
          if-no-files-found: warn
          retention-days: 14

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          data: "false"
      - run: cmake --preset fuzz -DAAD_PRICER_BUILD_QUANTLIB_COMPARE=OFF
      - run: cmake --build --preset fuzz --parallel "$AADP_JOBS"
      - run: python3 -I scripts/run_tests.py fuzz --seconds "$AADP_FUZZ_SECONDS"

  repo-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Data too, or the raw-row check cannot run.
      - uses: ./.github/actions/setup
        with:
          ninja: "false"
          llvm: "false"
      - run: python3 -I scripts/scan_repo.py

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/fetch_tools.sh
      # Named, so the pinned shellcheck lints every run: step and not whatever the image has.
      - run: build/tools/actionlint -no-color -shellcheck build/tools/shellcheck .github/workflows/ci.yml
